<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אימונים">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1319" media="(prefers-color-scheme: dark)">
<title>יומן אימונים</title>
<link id="manifest" rel="manifest">
<link id="appicon" rel="apple-touch-icon">
<style>
  :root{
    --paper:#EEF1F5; --card:#FFFFFF; --ink:#111820; --muted:#6A7684; --line:#DBE1E9;
    --accent:#E4571B; --done:#2F7D4F; --blue:#2F6FED; --radius:16px; --tap:48px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#0E1319; --card:#171E27; --ink:#EAEEF3; --muted:#8C99A8; --line:#242E3A;
           --accent:#FF7A3D; --done:#4FB07A; --blue:#5C90FF; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Segoe UI",system-ui,"Arial Hebrew",Arial,sans-serif;
    font-size:17px;line-height:1.35;-webkit-user-select:none;user-select:none;
    overscroll-behavior-y:contain;font-variant-numeric:tabular-nums;}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,select,textarea{font:inherit;font-size:16px;color:inherit}

  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 8px) 14px 6px}
  .navrow{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:center}
  .navbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;font-size:26px;color:var(--muted);border-radius:12px}
  .navbtn:active{background:var(--line)}
  .navbtn.hid{visibility:hidden}
  .title{text-align:center}
  .range{font-size:19px;font-weight:700;letter-spacing:-.2px}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:8px;justify-content:center;align-items:center}
  .todaybtn{color:var(--accent);font-size:13px;font-weight:600}
  .util{display:flex;align-items:center;gap:8px;height:32px}
  .gear{margin-inline-start:auto;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);font-size:18px;border-radius:10px}
  .gear:active{background:var(--line)}
  .who{height:30px;padding:0 11px;display:grid;place-items:center;color:var(--muted);font-size:14px;font-weight:600;border-radius:10px;background:var(--card);border:1px solid var(--line)}

  main{padding:10px 12px 170px;max-width:560px;margin:0 auto}

  /* ----- week ----- */
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;padding:10px 12px;
    display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:8px}
  .day.empty{padding:7px 12px;background:transparent;border-style:dashed}
  .day.today{border-color:var(--accent);border-width:2px;padding:9px 11px}
  .dname{font-weight:700;font-size:16px}
  .day.empty .dname{font-weight:500;color:var(--muted)}
  .ddate{font-size:12px;color:var(--muted);margin-top:1px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:11px;font-size:14px;font-weight:600;
    background:transparent;color:var(--c);border:1px solid var(--c);
    background:color-mix(in srgb, var(--c) 14%, transparent);
    border-color:color-mix(in srgb, var(--c) 34%, transparent);max-width:100%}
  .chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .chip .x{font-size:12px;opacity:.75}
  .chip.planned{background:transparent;color:var(--muted);border-style:dashed;border-color:var(--line);font-weight:500}
  .chip.planned .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:5px}
  .note{font-size:12px;color:var(--muted);opacity:.9}
  .addbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:26px;font-weight:300;color:var(--accent);
    background:transparent;background:color-mix(in srgb, var(--accent) 12%, transparent)}
  .empty .addbtn{width:34px;height:34px;font-size:22px;background:transparent;color:var(--muted)}

  /* ----- cards / lists ----- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .card h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .stat .v{font-size:24px;font-weight:700;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .stat .p{font-size:12px;color:var(--blue);font-weight:600;margin-top:2px}
  .listrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;margin-bottom:7px;width:100%;text-align:start}
  .listrow:active{background:var(--line)}
  .listrow .main{flex:1;min-width:0}
  .listrow .t1{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .t2{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:none;background:transparent;background:color-mix(in srgb, var(--accent) 13%, transparent);
    color:var(--accent);font-weight:700;border-radius:11px;padding:6px 10px;font-size:15px;text-align:center;min-width:52px}
  .badge small{display:block;font-size:10px;font-weight:600;opacity:.8}
  .segs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
  .seg{flex:none;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
  .seg.on{border-color:var(--accent);color:var(--accent);background:transparent;background:color-mix(in srgb, var(--accent) 12%, transparent)}
  .blank{text-align:center;color:var(--muted);font-size:15px;padding:34px 20px;line-height:1.6}
  svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}

  /* ----- bottom ----- */
  .bar{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:21;padding:8px 14px;
    background:linear-gradient(to top, var(--paper) 70%, transparent)}
  .primary{display:block;width:100%;max-width:532px;margin:0 auto;background:var(--accent);color:#fff;font-size:18px;font-weight:700;
    padding:16px;border-radius:15px;text-align:center}
  .primary:active{filter:brightness(.92)}
  .ghost{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600;text-align:center}
  .tabs{position:fixed;inset-inline:0;bottom:0;z-index:22;display:grid;grid-template-columns:repeat(3,1fr);
    background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tab{padding:8px 0 9px;text-align:center;color:var(--muted);font-size:11px;font-weight:600}
  .tab span{display:block;font-size:21px;line-height:1.15;filter:grayscale(1);opacity:.65}
  .tab.on{color:var(--accent)}
  .tab.on span{filter:none;opacity:1}

  /* ----- sheet ----- */
  .scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--paper);border-radius:22px 22px 0 0;
    padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(102%);transition:transform .24s cubic-bezier(.32,.72,0,1);max-width:560px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
  .sheet h2{font-size:19px;margin:0 0 4px}
  .sheet h3{font-size:13px;color:var(--muted);font-weight:600;margin:20px 0 8px}
  .sheet p.hint{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.5}
  .opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:8px;font-size:17px;font-weight:600;text-align:start}
  .opt:active{background:var(--line)}
  .opt .em{font-size:20px;line-height:1}
  .opt .tail{margin-inline-start:auto;color:var(--muted);font-size:14px;font-weight:500}
  .opt.danger{color:#C63232}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input, .field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .num label{text-align:center}
  .num input{text-align:center;font-size:20px;font-weight:700;padding:11px 4px}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
  .sw.sel{border-color:var(--ink)}
  .ems{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
  .em-opt{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px}
  .em-opt.sel{border-color:var(--accent);border-width:2px}
  pre.report{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:inherit;font-size:15px;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;margin:0 0 14px;-webkit-user-select:text;user-select:text;max-height:42vh;overflow:auto}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:8px}
  .switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
  .switch i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on{background:var(--done)}
  .switch.on i{transform:translateX(-20px)}
  .tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
  .tline b{font-size:14px;min-width:52px}
  .tpick{padding:5px 9px;border-radius:9px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
  .tpick.on{border-style:solid;border-color:var(--c);background:transparent;color:var(--c);font-weight:600}
  #toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom) + 130px);z-index:60;display:flex;justify-content:center;pointer-events:none}
  #toast .t{background:var(--ink);color:var(--paper);border-radius:13px;padding:12px 16px;font-size:15px;display:flex;align-items:center;gap:16px;
    opacity:0;transform:translateY(8px);transition:all .18s ease;pointer-events:auto;max-width:92%}
  #toast .t.on{opacity:1;transform:none}
  #toast button{color:var(--accent);font-weight:700}
  /* ----- מסך כניסה ----- */
  #gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:grid;place-items:center;overflow:auto;
    padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 26px)}
  #gate[hidden]{display:none}
  .gbox{width:100%;max-width:370px;text-align:center}
  .gmark{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;font-size:30px;
    display:grid;place-items:center;margin:0 auto 14px}
  #gate h1{font-size:24px;margin:0 0 8px;letter-spacing:-.3px}
  .glede{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 24px}
  .gbtn{width:100%;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);
    font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
  .gbtn:active{background:var(--line)}
  .gbtn .g{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);
    color:#4285F4;font-weight:800;font-size:15px;display:grid;place-items:center;flex:none}
  .gor{color:var(--muted);font-size:13px;margin:20px 0 14px}
  #gate .field{text-align:start}
  .glinks{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .glink{color:var(--muted);font-size:14px;text-decoration:underline}
  .gmsg{min-height:22px;font-size:14px;line-height:1.4;margin:16px 0 0;color:var(--accent)}
  .gmsg.ok{color:var(--done)}
  .gwait{color:var(--muted);font-size:15px}
  body.locked > header, body.locked > main, body.locked > .bar, body.locked > nav{display:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="gate" hidden>
  <div class="gbox" id="gbox"></div>
</section>

<header>
  <div class="util">
    <button class="who" id="who" hidden></button>
    <button class="gear" id="gear" aria-label="הגדרות">⚙︎</button>
  </div>
  <div class="navrow">
    <button class="navbtn" id="prev" aria-label="הקודם">›</button>
    <div class="title">
      <div class="range" id="range"></div>
      <div class="sub"><span id="sub"></span><button class="todaybtn" id="todayBtn" hidden>היום</button></div>
    </div>
    <button class="navbtn" id="next" aria-label="הבא">‹</button>
  </div>
</header>

<main id="view"></main>

<div class="bar"><button class="primary" id="cta"></button></div>
<nav class="tabs">
  <button class="tab" data-tab="train"><span>🏀</span>אימונים</button>
  <button class="tab" data-tab="grow"><span>📏</span>גדילה</button>
  <button class="tab" data-tab="games"><span>📊</span>משחקים</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

const KEY = "training-log:v2", OLDKEY = "training-log:v1";
const Store = {
  async get(k){
    try{ if (window.storage && window.storage.get){ const r = await window.storage.get(k); return r && r.value ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  },
  async set(k, obj){
    const s = JSON.stringify(obj);
    try{ if (window.storage && window.storage.set){ await window.storage.set(k, s); return true; } }catch(e){}
    try{ localStorage.setItem(k, s); return true; }catch(e){ return false; }
  }
};

/* ---------- תאריכים ---------- */
function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function startOfWeek(d){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-x.getDay()); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function rangeLabel(s){
  const e = addDays(s,6);
  return s.getMonth()===e.getMonth()
    ? s.getDate()+"–"+e.getDate()+" "+MONTHS[e.getMonth()]+" "+e.getFullYear()
    : s.getDate()+" "+MONTHS[s.getMonth()]+" – "+e.getDate()+" "+MONTHS[e.getMonth()]+" "+e.getFullYear();
}
const isToday = d => key(d)===key(new Date());
function shortDate(k){ const d = parseKey(k); return d.getDate()+"."+(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2); }
function ageMonths(dob, onKey){
  if (!dob) return null;
  const a = parseKey(dob), b = onKey ? parseKey(onKey) : new Date();
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  const dayFrac = (b.getDate()-a.getDate()) / 30.4375;
  return m + dayFrac;
}
function ageText(dob){
  const m = ageMonths(dob);
  if (m===null) return "";
  let y = Math.floor(m/12), mo = Math.round(m-y*12);
  if (mo===12){ y++; mo=0; }
  return y+" שנים"+(mo?" ו-"+mo+" חודשים":"");
}

function lmsAt(sex, metric, months){
  const tbl = (LMS[sex]||LMS.b)[metric]; if (!tbl || !tbl.length) return null;
  if (months <= tbl[0][0]) return tbl[0].slice(1);
  if (months >= tbl[tbl.length-1][0]) return tbl[tbl.length-1].slice(1);
  for (let i=1;i<tbl.length;i++){
    if (months <= tbl[i][0]){
      const a = tbl[i-1], b = tbl[i], f = (months-a[0])/(b[0]-a[0]);
      return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
    }
  }
  return null;
}
function zScore(v, L, M, S){ return L ? (Math.pow(v/M, L)-1)/(L*S) : Math.log(v/M)/S; }
function normCdf(z){
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  let p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0 ? 1-p : p;
}
function percentile(sex, metric, months, value){
  const l = lmsAt(sex, metric, months); if (!l || !value) return null;
  return Math.round(normCdf(zScore(value, l[0], l[1], l[2]))*100);
}
function valueAtPct(sex, metric, months, pct){
  const l = lmsAt(sex, metric, months); if (!l) return null;
  const z = zFromP(pct), [L,M,S] = l;
  return L ? M*Math.pow(1+L*S*z, 1/L) : M*Math.exp(S*z);
}
function zFromP(p){ return ({3:-1.881,15:-1.036,50:0,85:1.036,97:1.881})[p]; }
function pctLabel(p){ return p===null ? "" : "אחוזון "+Math.max(1,Math.min(99,p)); }

function entriesOf(k){ return mine("entries").filter(e=>e.date===k).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")); }
function groupEntries(list){
  const out=[];
  list.forEach(e=>{ const g = out.find(g=>g.typeId===e.typeId && !e.note && !g.entries.some(x=>x.note));
    if (g) g.entries.push(e); else out.push({typeId:e.typeId, entries:[e]}); });
  return out;
}

function renderTrain(){

/* ---------------- גדילה ---------------- */
const METRICS = { h:{label:"גובה", unit:"ס״מ", field:"height", lms:"h"},
                  w:{label:"משקל", unit:"ק״ג", field:"weight", lms:"w"},
                  bmi:{label:"BMI", unit:"", field:"bmi", lms:"bmi"},

                  arm:{label:"היקף זרוע", unit:"ס״מ", field:"arm", lms:null},
                  thigh:{label:"היקף ירך", unit:"ס״מ", field:"thigh", lms:null} };
const MANUAL_PCT = { h:"hPct", w:"wPct" };
function measList(){ return mine("measurements").slice().sort((a,b)=> a.date.localeCompare(b.date)); }
function mVal(m, k){
  if (k==="bmi") return (m.weight && m.height) ? m.weight/Math.pow(m.height/100,2) : null;
  return m[METRICS[k].field] || null;
}
function renderGrow(){

  if (last.waist || last.arm || last.thigh)

  if (vel) html += '<div class="note" style="margin-top:12px">קצב גדילה: '+vel.toFixed(1)+' ס״מ בשנה</div>';
  html += '</div>';
  if (!p.dob) html += '<button class="ghost" id="setdob" style="margin-bottom:10px">הזנת תאריך לידה להצגת אחוזונים</button>';

  html += '<div class="segs">' + Object.keys(METRICS).map(k=>
      '<button class="seg'+(k===growMetric?" on":"")+'" data-m="'+k+'">'+METRICS[k].label+'</button>').join("") + '</div>';

        + (m.fat?" · "+m.fat+"% שומן":"") + '</div><div class="t2">'+shortDate(m.date)
        + (m.time?" · "+esc(m.time):"") + (p.dob?" · גיל "+(a/12).toFixed(1):"")+'</div></div>'
        + (show!==null&&show!==undefined?'<div class="badge">'+show+'<small>גובה</small></div>':'') + '</button>';
    }).join("") + '</div>';

  view.querySelectorAll("[data-id]").forEach(b=> b.onclick = ()=> measureSheet(data.measurements.find(m=>m.id===b.dataset.id)));

function growthRate(list){
  if (list.length<2) return null;
  const b = list[list.length-1], a = list.find(x=> x.height && (parseKey(b.date)-parseKey(x.date))/864e5 >= 120);
  if (!a || !b.height || !a.height) return null;
  const yrs = (parseKey(b.date)-parseKey(a.date))/864e5/365.25;
  return (b.height-a.height)/yrs;
}
function growthChart(k, list){
  const p = P(), W = 320, H = 210, ml = 30, mr = 8, mt = 10, mb = 22;
  const pts = list.map(m=>({ x: p.dob ? ageMonths(p.dob,m.date)/12 : (parseKey(m.date)-parseKey(list[0].date))/864e5/365.25,
                             y: mVal(m,k), d:m.date })).filter(o=>o.y!==null);
  if (!pts.length) return '<div class="blank">אין נתונים למדד הזה</div>';
  const useLms = !!(p.dob && METRICS[k].lms);
  let x0 = Math.min.apply(null, pts.map(o=>o.x)), x1 = Math.max.apply(null, pts.map(o=>o.x));
  if (x1-x0 < 1.5){ const c=(x0+x1)/2; x0=c-0.9; x1=c+0.9; } else { x0-=0.25; x1+=0.4; }
  let ys = pts.map(o=>o.y), y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  const bands = [3,15,50,85,97], curves = {};
  if (useLms){
    bands.forEach(b=>{
      const arr = [];
      for (let x=x0; x<=x1+0.001; x+=(x1-x0)/40){
        const v = valueAtPct(p.sex, METRICS[k].lms, x*12, b);
        if (v) arr.push([x,v]);
      }
      curves[b] = arr;
      arr.forEach(a=>{ y0=Math.min(y0,a[1]); y1=Math.max(y1,a[1]); });
    });
  }
  const pad = (y1-y0)*0.08 || 1; y0-=pad; y1+=pad;
  const sx = x => ml + (x-x0)/(x1-x0)*(W-ml-mr);
  const sy = y => mt + (1-(y-y0)/(y1-y0))*(H-mt-mb);
  let g = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף '+METRICS[k].label+'">';
  for (let i=0;i<=3;i++){
    const y = y0+(y1-y0)*i/3;
    g += '<line x1="'+ml+'" y1="'+sy(y).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+sy(y).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'
      +  '<text x="'+(W-mr)+'" y="'+(sy(y)-3).toFixed(1)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+(y>=100?Math.round(y):y.toFixed(1))+'</text>';
  }
  const xt0 = Math.ceil(x0);
  for (let x=xt0; x<=x1; x++){
    g += '<text x="'+sx(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+x+'</text>';
  }
  if (useLms) bands.forEach(b=>{
    const d = curves[b].map((a,i)=>(i?"L":"M")+sx(a[0]).toFixed(1)+","+sy(a[1]).toFixed(1)).join(" ");
    g += '<path d="'+d+'" fill="none" stroke="var(--muted)" stroke-width="'+(b===50?1.3:0.8)+'" opacity="'+(b===50?0.55:0.3)+'" '+(b===50?'':'stroke-dasharray="3 3"')+'/>';
    const lastP = curves[b][curves[b].length-1];
    g += '<text x="'+(sx(lastP[0])-2).toFixed(1)+'" y="'+(sy(lastP[1])-2).toFixed(1)+'" font-size="8" fill="var(--muted)" text-anchor="end">'+b+'</text>';
  });
  const dd = pts.map((o,i)=>(i?"L":"M")+sx(o.x).toFixed(1)+","+sy(o.y).toFixed(1)).join(" ");
  g += '<path d="'+dd+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>';
  pts.forEach(o=> g += '<circle cx="'+sx(o.x).toFixed(1)+'" cy="'+sy(o.y).toFixed(1)+'" r="3.4" fill="var(--accent)"/>');
  g += '<text x="'+ml+'" y="'+(H-6)+'" font-size="9" fill="var(--muted)">'+(p.dob?"גיל בשנים":"שנים מאז המדידה הראשונה")+'</text></svg>';
  return g;
}
function normDate(v){
  if (!v) return "";
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m = t.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if (m){ const y = m[3].length===2 ? "20"+m[3] : m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return "";
}
function mapMeasurements(raw){
  const arr = Array.isArray(raw) ? raw : (raw.measurements || raw.data || []);
  const inM = !!(raw && raw.units && raw.units.height === "m");
  const pick = (o,keys)=>{ for (let i=0;i<keys.length;i++){ const v = o[keys[i]]; if (v!==undefined && v!==null && v!=="") return v; } return null; };
  return arr.map(o=>{
    let h = pick(o,["heightCm","height_cm","height","גובה"]);
    const hm = pick(o,["heightM","height_m"]);
    if (h===null && hm!==null) h = Number(hm)*100;
    else if (h!==null && (inM || Number(h)<3)) h = Number(h)*100;
    return { date: normDate(pick(o,["date","תאריך"])), time: pick(o,["time","שעה"]) || "",
      height: h===null ? null : Math.round(Number(h)*10)/10,
      weight: num(pick(o,["weightKg","weight_kg","weight","משקל"])),
      fat:    num(pick(o,["fatPct","fat_pct","fat","bodyFat","אחוז שומן"])),
      waist:  num(pick(o,["navelCm","waistCm","navel","waist","היקף טבור"])),
      arm:    num(pick(o,["armCm","arm","היקף זרוע"])),
      thigh:  num(pick(o,["thighCm","thigh","היקף ירך"])),
      hPct:   num(pick(o,["heightPct","heightPercentile","אחוזון גובה"])),
      wPct:   num(pick(o,["weightPct","weightPercentile","אחוזון משקל"])) };
  }).filter(r=>r.date);
}
function applyMeasurements(rows){
  let added = 0, updated = 0;
  rows.forEach(r=>{
    const ex = mine("measurements").find(x=> x.date===r.date);
    if (ex){ Object.assign(ex, r); touch(ex); updated++; }
    else { data.measurements.push(Object.assign({id:uid("m"), playerId:data.activePlayerId, updatedAt:now(), deleted:false}, r)); added++; }
  });
  save(); render();
  return {added, updated};
}
function pickMeasFile(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json"; i.style.display = "none";
  document.body.appendChild(i);
  i.onchange = ()=>{ if (i.files[0]) importMeasurements(i.files[0]); setTimeout(()=> i.remove(), 0); };
  i.click();
}
function importMeasurements(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    let raw; try{ raw = JSON.parse(rd.result); }catch(e){ toast("הקובץ לא תקין"); return; }
    const rows = mapMeasurements(raw);
    if (!rows.length){ toast("לא נמצאו מדידות בקובץ"); return; }
    const dates = rows.map(r=>r.date).sort();
    const dup = rows.filter(r=> mine("measurements").some(x=> x.date===r.date)).length;
    const miss = rows.filter(r=> !r.thigh).length;
    openSheet('<h2>ייבוא מדידות</h2>'
      + '<p class="hint">נמצאו '+rows.length+' מדידות, מ-'+shortDate(dates[0])+' עד '+shortDate(dates[dates.length-1])+'.'
      + (raw.player?' שם בקובץ: '+esc(raw.player)+'.':'')
      + (dup?' '+dup+' מהן כבר קיימות באותו תאריך ויתעדכנו.':'')
      + (miss?' ב-'+miss+' מהן חסר היקף ירך, והשדה יישאר ריק.':'') + '</p>'
      + '<p class="hint">הן ייכנסו לשחקן הפעיל: '+esc((P().name||"ללא שם"))+'</p>'
      + '<button class="primary" id="go">ייבוא</button>');
    $("#go").onclick = ()=>{
      const r = applyMeasurements(rows); closeSheet();
      toast("נוספו "+r.added+" מדידות"+(r.updated?", עודכנו "+r.updated:""));
      tab = "grow"; render();
    };
  };
  rd.readAsText(file);
}
function measureSheet(m){

    + '<div class="grid3">' + fld("mh","גובה · ס״מ",v.height) + fld("mw","משקל · ק״ג",v.weight) + fld("mf","שומן · %",v.fat) + '</div>'
    + '<h3>היקפים · ס״מ</h3>'

    + '<h3>אחוזונים מהדיאטנית</h3>'
    + '<p class="hint">אפשר להשאיר ריק. בלי ערך ידני האפליקציה מחשבת אחוזון בעצמה לפי טבלאות הייחוס, ומציגה אותו.</p>'
    + '<div class="grid2">' + fld("mhp","אחוזון גובה",v.hPct) + fld("mwp","אחוזון משקל",v.wPct) + '</div>'

function gamesChart(k, list){
  const W=320,H=170,ml=26,mr=8,mt=10,mb=26, n=list.length;
  const vals = list.map(g=> k==="eff" ? eff(g) : (g[k]||0));
  const max = Math.max.apply(null, vals.concat([1]));
  const min = Math.min.apply(null, vals.concat([0]));
  const bw = Math.max(3, Math.min(28, (W-ml-mr)/n - 4));
  const sy = v => mt + (1-(v-min)/((max-min)||1))*(H-mt-mb);
  let g = '<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
  g += '<line x1="'+ml+'" y1="'+sy(Math.max(0,min)).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+sy(Math.max(0,min)).toFixed(1)+'" stroke="var(--line)"/>';
  g += '<text x="'+(W-mr)+'" y="'+(mt+8)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+max+'</text>';
  list.forEach((game,i)=>{
    const cx = ml + (i+0.5)*((W-ml-mr)/n);
    const v = vals[i], y = sy(v), y0 = sy(Math.max(0,min));
    g += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Math.min(y,y0).toFixed(1)+'" width="'+bw.toFixed(1)
       + '" height="'+Math.max(1,Math.abs(y0-y)).toFixed(1)+'" rx="3" fill="var(--accent)" opacity="'+(0.55+0.45*(v/max))+'"/>';
    g += '<text x="'+cx.toFixed(1)+'" y="'+(Math.min(y,y0)-3).toFixed(1)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+v+'</text>';
    if (n<=8) g += '<text x="'+cx.toFixed(1)+'" y="'+(H-6)+'" font-size="8" fill="var(--muted)" text-anchor="middle">'+esc((game.opponent||"").slice(0,6))+'</text>';
  });
  if (n>8) g += '<text x="'+ml+'" y="'+(H-6)+'" font-size="9" fill="var(--muted)">מהמשחק הישן לחדש</text>';
  return g+'</svg>';
}

function buildReport(){
  const s = startOfWeek(cursor), L = [], nm = (P().name||"").trim();
  L.push("דוח אימונים שבועי");
  L.push((nm?nm+" | ":"")+rangeLabel(s));
  L.push("");
  let total = 0; const byType = {}; const missed = [];
  for (let i=0;i<7;i++){
    const k = key(addDays(s,i)), list = entriesOf(k);
    total += list.length;
    const parts = groupEntries(list).map(g=>{
      const t = typeById(g.typeId), tn = t?t.name:"אימון";
      g.entries.forEach(()=> byType[tn] = (byType[tn]||0)+1);
      const note = g.entries.map(e=>e.note).filter(Boolean).join(", ");
      return tn + (g.entries.length>1?" ×"+g.entries.length:"") + (note?" ("+note+")":"");
    });
    L.push(DAYS[i]+": "+(parts.length?parts.join(", "):"ללא אימון"));
    if (P().templateOn){
      const done = list.map(e=>e.typeId);
      (P().template[i]||[]).forEach(id=>{ if (!done.includes(id) && typeById(id)) missed.push(DAYS[i]+": "+typeById(id).name); });
    }
  }
  L.push(""); L.push("סה״כ השבוע: "+total+(total===1?" אימון":" אימונים"));
  const ks = Object.keys(byType);
  if (ks.length){ L.push(""); L.push("סיכום לפי סוג:"); ks.forEach(k2=> L.push(k2+": "+byType[k2])); }
  if (missed.length){ L.push(""); L.push("תוכנן ולא בוצע:"); missed.forEach(m=> L.push(m)); }
  return L.map(l=> l?RLM+l:"").join("\n");
}

/* ============================================================
   6. חשבון, ריבוי משתמשים וסנכרון (Firebase)

   כל משתמש שנכנס מקבל "מרחב" משלו: שחקנים, אימונים, מדידות
   ומשחקים ששייכים רק לו. אפשר לצרף אנשים נוספים לאותו מרחב
   לפי כתובת מייל, וכך שני מכשירים עובדים על אותם נתונים.
   כל רשומה נושאת updatedAt, ולכן עריכה מקבילה לא מוחקת מידע:
   הגרסה המאוחרת מנצחת.
   ============================================================ */

/* ---------- מיזוג מסמך שלם (גם לשחזור מקובץ) ---------- */
function mergeDoc(remote){
  if (!remote || typeof remote !== "object") return 0;
  let changed = 0;
  COLS.forEach(c=>{
    if (!Array.isArray(remote[c])) return;
    const idx = {}; data[c].forEach(r=> idx[r.id] = r);
    remote[c].forEach(r=>{
      const cur = idx[r.id];
      if (!cur){ data[c].push(r); changed++; }
      else if ((r.updatedAt||"") > (cur.updatedAt||"")){ Object.assign(cur, r); changed++; }
    });
  });
  if (remote.settings && (remote.settings.updatedAt||"") > (data.settings.updatedAt||"")){
    data.settings = Object.assign({}, remote.settings);
    delete data.settings.sync;
    changed++;
  }
  if (changed){ Store.set(KEY, data); queuePush(); }
  return changed;
}

/* ---------- מה כבר נשלח לשרת ---------- */
function loadPushed(){
  try{ pushed = JSON.parse(localStorage.getItem(PUSHKEY+":"+(space?space.id:"")) || "{}"); }catch(e){ pushed = {}; }
}
function savePushed(){
  try{ localStorage.setItem(PUSHKEY+":"+(space?space.id:""), JSON.stringify(pushed)); }catch(e){}
}

function cleanSettings(){
  const o = Object.assign({}, data.settings);
  delete o.sync;
  return o;
}

function queuePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 1200); }

function cloudPush(){
  if (!WANTS_CLOUD || !cloud.api || !user || !space || pushing) return;
  const out = {}; let n = 0;
  COLS.forEach(c=>{
    const list = data[c].filter(r=> pushed[r.id] !== (r.updatedAt||""));
    if (list.length){ out[c] = list; n += list.length; }
  });
  const setDirty = (data.settings.updatedAt||"") !== pushed.__settings;
  if (!n && !setDirty) return;
  pushing = true;
  cloud.api.push(out, setDirty ? cleanSettings() : null).then(()=>{
    COLS.forEach(c=> (out[c]||[]).forEach(r=> pushed[r.id] = r.updatedAt||""));
    if (setDirty) pushed.__settings = data.settings.updatedAt||"";
    savePushed();
  }).catch(()=>{}).then(()=>{ pushing = false; });
}

/* ---------- החלפת מרחב: הנתונים המקומיים לא נוסעים איתנו ---------- */
function wipeLocal(){
  COLS.forEach(c=> data[c] = []);
  data.activePlayerId = null;
  data.settings = {parentPhone:"", deviceName:data.settings.deviceName||"", lastBackupAt:null,
                   updatedAt:new Date(0).toISOString()};
  Store.set(KEY, data);
}

/* ---------- מה שהמודול של Firebase מדווח בחזרה ---------- */
let gateMsg = "", gateOk = false, gateWait = null;

cloud.onUser = function(u){
  clearTimeout(gateWait);
  authKnown = true; busy = false; gateMsg = ""; gateOk = false;
  user = u;
  if (!u){ space = null; pushed = {}; }
  paintGate(); render();
};
cloud.onHome = function(id){ homeSpaceId = id; };
cloud.onSpace = function(sp){
  const known = localStorage.getItem(SPACEKEY);
  if (sp.id !== known){
    if (known) wipeLocal();          // עברנו למרחב אחר, מתחילים נקי
    try{ localStorage.setItem(SPACEKEY, sp.id); }catch(e){}
    pushed = {}; savePushed();
  }
  space = sp;
  if (!Object.keys(pushed).length) loadPushed();
  paintGate(); render();
  setTimeout(cloudPush, 600);
};
cloud.onRecords = function(col, list){
  if (COLS.indexOf(col) < 0) return;
  let changed = 0;
  const idx = {}; data[col].forEach(r=> idx[r.id] = r);
  list.forEach(r=>{
    pushed[r.id] = r.updatedAt||"";
    const cur = idx[r.id];
    if (!cur){ data[col].push(r); changed++; }
    else if ((r.updatedAt||"") > (cur.updatedAt||"")){ Object.assign(cur, r); changed++; }
  });
  if (col==="players" && !data.activePlayerId){
    const first = data.players.find(x=>!x.deleted);
    if (first){ data.activePlayerId = first.id; changed++; }
  }
  if (changed){ Store.set(KEY, data); render(); }
  savePushed();
};
cloud.onSettings = function(o){
  if (!o) return;
  if ((o.updatedAt||"") > (data.settings.updatedAt||"")){
    data.settings = Object.assign({}, o);
    pushed.__settings = o.updatedAt||"";
    Store.set(KEY, data); savePushed(); render();
  }
};
cloud.onProblem = function(msg){ busy = false; gateMsg = msg; gateOk = false; if (user) toast(msg); paintGate(); };
cloud.onNotice  = function(msg){ busy = false; gateMsg = msg; gateOk = true;  if (user) toast(msg); paintGate(); };
cloud.onDown    = function(){ cloudDown = true; authKnown = true; busy = false; paintGate(); render(); };

/* ---------- מסך הכניסה ---------- */
function paintGate(){
  const g = document.getElementById("gate");
  const locked = WANTS_CLOUD && !cloudDown && (!authKnown || !user);
  document.body.classList.toggle("locked", locked);
  g.hidden = !locked;
  if (!locked) return;
  const box = document.getElementById("gbox");
  if (!authKnown){
    box.innerHTML = '<div class="gmark">🏀</div><h1>יומן אימונים</h1><p class="gwait">רגע, בודק אם כבר נכנסת…</p>';
    return;
  }
  box.innerHTML = '<div class="gmark">🏀</div>'
    + '<h1>יומן אימונים</h1>'
    + '<p class="glede">האימונים, המדידות והמשחקים נשמרים בחשבון שלך, ונפתחים בכל מכשיר שתיכנס ממנו. '
    + 'לכל משתמש יש נתונים נפרדים.</p>'
    + '<button class="gbtn" id="gGoogle"' + (busy?" disabled":"") + '><span class="g">G</span>כניסה עם Google</button>'
    + '<p class="gmsg' + (gateOk?" ok":"") + '">' + esc(gateMsg) + '</p>';

  document.getElementById("gGoogle").onclick = ()=>{
    if (!cloud.api){ gateMsg = "החיבור לשרת עוד לא נטען. נסה שוב עוד רגע."; paintGate(); return; }
    busy = true; gateMsg = ""; paintGate(); cloud.api.google();
    clearTimeout(gateWait);
    gateWait = setTimeout(()=>{
      if (!user){ busy = false; gateOk = false;
        gateMsg = "הכניסה עם Google לא חזרה. אפשר לנסות שוב."; paintGate(); }
    }, 30000);
  };
}

async function exportBackup(){
  const json = JSON.stringify(data, null, 2), fname = "training-log-"+key(new Date())+".json";
  data.settings.lastBackupAt = now(); data.settings.updatedAt = now(); save();
  try{
    const file = new File([json], fname, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"גיבוי יומן אימונים"});
      toast("הגיבוי נשלח"); closeSheet(); return;
    }
  }catch(e){}
  try{
    const url = URL.createObjectURL(new Blob([json],{type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast("קובץ הגיבוי נשמר"); closeSheet();
  }catch(e){
    openSheet('<h2>גיבוי כטקסט</h2><p class="hint">העתק ושלח לעצמך.</p><pre class="report">'+esc(json)+'</pre>');
  }
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    let inc; try{ inc = JSON.parse(rd.result); }catch(e){ toast("הקובץ לא תקין"); return; }
    if (!inc || !Array.isArray(inc.entries)){ toast("הקובץ לא תקין"); return; }
    openSheet('<h2>שחזור מקובץ</h2><p class="hint">בקובץ יש '+(inc.entries||[]).length+' אימונים, '
      +(inc.measurements||[]).length+' מדידות ו-'+(inc.games||[]).length+' משחקים.</p>'
      + '<button class="opt" id="merge"><span class="em">⊕</span>מיזוג עם הנתונים הקיימים</button>'
      + '<button class="opt danger" id="repl"><span class="em">⟲</span>החלפה מלאה של הנתונים</button>');
    $("#merge").onclick = ()=>{ const n = mergeDoc(inc); render(); closeSheet(); toast(n?"מוזגו "+n+" רשומות":"הכל כבר היה מעודכן"); };
    $("#repl").onclick = ()=>{ data = migrate(inc); Store.set(KEY,data); render(); closeSheet(); toast("הנתונים שוחזרו"); };
  };
  rd.readAsText(file);
}

    setTimeout(()=>{ const el=$("#nt"); if(el) el.focus(); },250);
    $("#ok").onclick = ()=>{ entry.note = $("#nt").value.trim(); touch(entry); render(); closeSheet(); };
  };
  $("#swapBtn").onclick = ()=>{
    let html = '<h2>שינוי סוג האימון</h2>';
    myTypes().forEach(x=> html += '<button class="opt" data-t="'+x.id+'"><span class="em">'+x.icon+'</span>'+esc(x.name)+'</button>');
    openSheet(html);
    sheet.querySelectorAll("[data-t]").forEach(b=> b.onclick = ()=>{ entry.typeId = b.dataset.t; touch(entry); render(); closeSheet(); });
  };
}
function toast(msg, actionLabel, action){
  const wrap = $("#toast"); wrap.innerHTML = "";
  const t = document.createElement("div"); t.className = "t"; t.innerHTML = '<span>'+esc(msg)+'</span>';
  if (actionLabel){ const b = document.createElement("button"); b.textContent = actionLabel;
    b.onclick = ()=>{ action && action(); wrap.innerHTML=""; }; t.appendChild(b); }
  wrap.appendChild(t); requestAnimationFrame(()=> t.classList.add("on"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove("on"); setTimeout(()=> wrap.innerHTML = "", 200); }, actionLabel?5000:2200);
}

/* ============================================================
   10. ניווט והפעלה
   ============================================================ */
$("#prev").onclick = ()=>{ cursor = addDays(startOfWeek(cursor),-7); render(); };
$("#next").onclick = ()=>{ cursor = addDays(startOfWeek(cursor), 7); render(); };
$("#todayBtn").onclick = ()=>{ cursor = new Date(); render(); };

$("#who").onclick = ()=>{
  let html = '<h2>מי משחק?</h2>';
  live("players").forEach(x=> html += '<button class="opt" data-p="'+x.id+'"><span class="em">'+(x.id===data.activePlayerId?"●":"○")+'</span>'+esc(x.name||"ללא שם")+'</button>');
  openSheet(html);
  sheet.querySelectorAll("[data-p]").forEach(b=> b.onclick = ()=>{ data.activePlayerId = b.dataset.p; save(); render(); closeSheet(); });
};
document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=>{ tab = b.dataset.tab; window.scrollTo(0,0); render(); });

let tx=0, ty=0;
view.addEventListener("touchstart", e=>{ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
view.addEventListener("touchend", e=>{
  if (tab!=="train") return;
  const dx = e.changedTouches[0].clientX-tx, dy = e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){ cursor = addDays(startOfWeek(cursor), dx<0?7:-7); render(); }
}, {passive:true});

let dayMark = key(new Date());
setInterval(()=>{ const k = key(new Date()); if (k!==dayMark){ dayMark = k; render(); } }, 60000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ render(); cloudPush(); } });

  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="#E4571B"/><circle cx="90" cy="92" r="46" fill="none" stroke="#fff" stroke-width="9"/><path d="M90 46v92M44 92h92M58 58c24 18 24 50 0 68M122 58c-24 18-24 50 0 68" fill="none" stroke="#fff" stroke-width="7"/></svg>';
  const icon = "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));

      background_color:"#EEF1F5", theme_color:"#E4571B", start_url:".", icons:[{src:icon, sizes:"180x180", type:"image/svg+xml"}]};
    const mel = document.getElementById("manifest");
    if (mel) mel.href = URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
  }catch(e){}
})();

function migrate(d){
  if (!d) return freshData();
  if (!d.players && d.children){ d.players = d.children; delete d.children; }
  if (d.activeChildId){ d.activePlayerId = d.activeChildId; delete d.activeChildId; }
  d.players = d.players || []; d.types = d.types || []; d.entries = d.entries || [];
  d.measurements = d.measurements || []; d.games = d.games || [];
  d.players.forEach(p=>{ if (!p.template) p.template = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    if (p.dob===undefined) p.dob=""; if (!p.sex) p.sex="b"; });
  COLS.forEach(c=> d[c].forEach(r=>{
    if (r.childId && !r.playerId){ r.playerId = r.childId; delete r.childId; }
    if (!r.updatedAt) r.updatedAt = r.createdAt || new Date(2026,0,1).toISOString();
    if (r.deleted===undefined) r.deleted = false;
  }));
  d.settings = Object.assign({parentPhone:"",deviceName:"",lastBackupAt:null, updatedAt:now()}, d.settings||{});
  delete d.settings.sync;
  if (!d.deviceId) d.deviceId = uid("d");
  if (!d.activePlayerId && d.players[0]) d.activePlayerId = d.players[0].id;
  d.schemaVersion = 2;
  return d;
}
(async function init(){
  let loaded = await Store.get(KEY);
  if (!loaded){ const old = await Store.get(OLDKEY); if (old) loaded = old; }
  if (loaded) data = migrate(loaded);
  loadPushed();
  paintGate();
  render();
  // אם מודול הענן לא נטען תוך תשע שניות, ממשיכים מקומית במקום להישאר תקועים
  if (WANTS_CLOUD) setTimeout(()=>{ if (!authKnown) cloud.onDown(); }, 9000);
})();
</script>

<script type="module">
/* ===========================================================================
   מודול הענן. נטען רק כשיש הגדרות Firebase, וחי במודול נפרד: אם הרשת או
   הדפדפן חוסמים אותו, האפליקציה שלמעלה פשוט ממשיכה לעבוד מקומית.

   מבנה הנתונים בשרת:
     users/{uid}                 = { email, spaceId, homeSpaceId }
     spaces/{code}               = { ownerUid, ownerEmail, memberEmails[], settings }
     spaces/{code}/players/{id}
     spaces/{code}/types/{id}
     spaces/{code}/entries/{id}
     spaces/{code}/measurements/{id}
     spaces/{code}/games/{id}
   =========================================================================== */
var bridge = window.TrainingCloud;
if (bridge.configured) {
  try {
    var V = "https://www.gstatic.com/firebasejs/10.14.1/";
    var appMod  = await import(V + "firebase-app.js");
    var authMod = await import(V + "firebase-auth.js");
    var dbMod   = await import(V + "firebase-firestore.js");

    var app  = appMod.initializeApp(bridge.config);
    var auth = authMod.getAuth(app);
    var db   = dbMod.getFirestore(app);
    await authMod.setPersistence(auth, authMod.browserLocalPersistence);

    var COLS = ["players", "types", "entries", "measurements", "games"];

    var SAYS = {
      "auth/invalid-email": "כתובת המייל אינה תקינה.",
      "auth/missing-password": "צריך למלא סיסמה.",
      "auth/weak-password": "הסיסמה קצרה מדי, צריך שישה תווים לפחות.",
      "auth/email-already-in-use": "כבר קיים חשבון עם המייל הזה. אפשר להיכנס איתו.",
      "auth/invalid-credential": "מייל או סיסמה שגויים.",
      "auth/wrong-password": "מייל או סיסמה שגויים.",
      "auth/user-not-found": "לא נמצא חשבון עם המייל הזה.",
      "auth/too-many-requests": "יותר מדי ניסיונות. נסה שוב עוד כמה דקות.",
      "auth/network-request-failed": "אין חיבור לרשת כרגע.",
      "auth/popup-closed-by-user": "חלון הכניסה נסגר לפני שהסתיים.",
      "auth/unauthorized-domain": "הכתובת הזו לא מאושרת ב Firebase. צריך להוסיף אותה תחת Authentication ← Settings ← Authorized domains.",
      "permission-denied": "אין הרשאה לקרוא או לכתוב. צריך לעדכן את כללי הגישה ב Firestore."
    };
    function say(err) {
      var code = (err && (err.code || err.message)) || "";
      bridge.onProblem(SAYS[code] || ("משהו השתבש: " + code));
    }

    var provider = new authMod.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    function installedApp() {
      if (window.navigator.standalone === true) return true;          // אייפון, מסך הבית
      if (!window.matchMedia) return false;
      return ["standalone", "fullscreen", "minimal-ui"].some(function (m) {
        return window.matchMedia("(display-mode: " + m + ")").matches;
      });
    }

    // חזרה מהפניה, כשחלון קופץ לא היה אפשרי
    authMod.getRedirectResult(auth).catch(function () {});

    /* ---------- מרחב הנתונים ---------- */
    var ALPHA = "abcdefghjkmnpqrstuvwxyz23456789";
    function newCode() {
      var out = "";
      for (var i = 0; i < 6; i++) out += ALPHA[Math.floor(Math.random() * ALPHA.length)];
      return out;
    }

    async function seedMichaelData(spaceId) {
      var pid = uid("p");
      var playerRef = dbMod.doc(db, "spaces", spaceId, "players", pid);
      await dbMod.setDoc(playerRef, {
        id: pid, name: "מיכאל", dob: "", sex: "b", coachPhone: "",
        color: "#2F6FED",
        template: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]}, templateOn: false,
        updatedAt: now(), deleted: false
      });
      var defaultTypes = [
        ["אימון קבוצתי","#2F6FED","🏀"],["חדר כושר","#E4571B","🏋️"],
        ["אימון אישי – אלון","#2F9E6B","👤"],["אימון אישי – רגב","#7C4DBF","👤"],
        ["אימון קליעות עצמאי","#D4A017","🎯"]
      ];
      var typeBatch = dbMod.writeBatch(db);
      defaultTypes.forEach(function(d){
        var tid = uid("t");
        typeBatch.set(dbMod.doc(db, "spaces", spaceId, "types", tid),
          {id:tid, playerId:pid, name:d[0], color:d[1], icon:d[2], archived:false, updatedAt:now(), deleted:false});
      });
      await typeBatch.commit();
      var rawMeasurements = [
        {date:"2025-09-12",time:"11:30",height:173,weight:52.00,fat:12.1,waist:70,arm:25.5,thigh:39.5,hPct:75,wPct:48},
        {date:"2025-10-24",time:"11:00",height:174,weight:55.00,fat:12.4,waist:71,arm:26.0,thigh:40.0,hPct:82,wPct:56},
        {date:"2025-12-05",time:"11:00",height:176,weight:56.40,fat:10.9,waist:73,arm:26.5,thigh:42.0,hPct:86,wPct:60},
        {date:"2026-01-23",time:"10:30",height:176,weight:58.30,fat:10.8,waist:72,arm:28.0,thigh:null,hPct:86,wPct:63},
        {date:"2026-04-24",time:"13:00",height:179,weight:62.60,fat:11.1,waist:74,arm:29.5,thigh:43.0,hPct:88,wPct:63},
        {date:"2026-07-10",time:"11:30",height:181,weight:64.10,fat:10.9,waist:75,arm:30.0,thigh:44.0,hPct:92,wPct:74}
      ];
      var measBatch = dbMod.writeBatch(db);
      rawMeasurements.forEach(function(r){
        var mid = uid("m");
        measBatch.set(dbMod.doc(db, "spaces", spaceId, "measurements", mid),
          Object.assign({id:mid, playerId:pid, updatedAt:now(), deleted:false}, r));
      });
      await measBatch.commit();
    }

        async function ensureSpace(u) {
      var uref = dbMod.doc(db, "users", u.uid);
      var snap = await dbMod.getDoc(uref);
      var cur = snap.exists() ? snap.data() : null;
      if (cur && cur.spaceId) return { spaceId: cur.spaceId, homeSpaceId: cur.homeSpaceId || cur.spaceId };

      var email = (u.email || "").toLowerCase();
      for (var i = 0; i < 8; i++) {
        var id = newCode();
        try {
          await dbMod.setDoc(dbMod.doc(db, "spaces", id), {
            ownerUid: u.uid, ownerEmail: email, memberEmails: [email],
            createdAt: new Date().toISOString()
          });
          await dbMod.setDoc(uref, { email: email, spaceId: id, homeSpaceId: id }, { merge: true });
          if (email === "betobetomicha@gmail.com") {
            try { await seedMichaelData(id); } catch(se) { console.error("seed error", se); }
          }
          return { spaceId: id, homeSpaceId: id };
        } catch (e) { /* הקוד תפוס, מנסים אחר */ }
      }
      throw new Error("לא הצלחתי לפתוח מרחב נתונים.");
    }

    var stops = [], activeSpace = null;
    function unwatch() { stops.forEach(function (f) { try { f(); } catch (e) {} }); stops = []; }

    function watch(sid) {
      unwatch();
      activeSpace = sid;
      COLS.forEach(function (c) {
        stops.push(dbMod.onSnapshot(dbMod.collection(db, "spaces", sid, c), function (snap) {
          var out = [];
          snap.forEach(function (d) { out.push(d.data()); });
          bridge.onRecords(c, out);
        }, say));
      });
      stops.push(dbMod.onSnapshot(dbMod.doc(db, "spaces", sid), function (d) {
        if (!d.exists()) return;
        var v = d.data();
        bridge.onSpace({ id: sid, ownerUid: v.ownerUid, ownerEmail: v.ownerEmail || "", memberEmails: v.memberEmails || [] });
        if (v.settings) bridge.onSettings(v.settings);
      }, say));
    }

    /* ---------- מה שהאפליקציה קוראת לו ---------- */
    bridge.api = {
      // בתוך אפליקציה שהותקנה למסך הבית חלון קופץ נפתח בהקשר שהאפליקציה לא
      // יכולה להגיע אליו, וההבטחה לא נפתרת ולא נכשלת. לכן בוחרים את השיטה
      // מראש לפי מצב התצוגה, ולא מנסים להתאושש אחרי כישלון שלא נזרק.
      google: function () {
        if (installedApp()) return authMod.signInWithRedirect(auth, provider).catch(say);
        return authMod.signInWithPopup(auth, provider).catch(function (e) {
          var c = (e && e.code) || "";
          if (c === "auth/popup-blocked" || c === "auth/cancelled-popup-request" ||
              c === "auth/operation-not-supported-in-this-environment")
            return authMod.signInWithRedirect(auth, provider).catch(say);
          say(e);
        });
      },
      signIn:  function (email, pw) { return authMod.signInWithEmailAndPassword(auth, email, pw).catch(say); },
      signUp:  function (email, pw) { return authMod.createUserWithEmailAndPassword(auth, email, pw).catch(say); },
      reset:   function (email) {
        return authMod.sendPasswordResetEmail(auth, email)
          .then(function () { bridge.onNotice("נשלח אליך מייל לאיפוס הסיסמה."); }).catch(say);
      },
      signOut: function () { unwatch(); activeSpace = null; return authMod.signOut(auth).catch(say); },

      push: async function (byCol, settings) {
        if (!auth.currentUser || !activeSpace) throw new Error("no-space");
        var writes = [];
        Object.keys(byCol).forEach(function (c) {
          byCol[c].forEach(function (r) {
            writes.push({ ref: dbMod.doc(db, "spaces", activeSpace, c, r.id), body: r, merge: false });
          });
        });
        if (settings) writes.push({ ref: dbMod.doc(db, "spaces", activeSpace), body: { settings: settings }, merge: true });
        for (var i = 0; i < writes.length; i += 400) {
          var batch = dbMod.writeBatch(db);
          writes.slice(i, i + 400).forEach(function (w) {
            if (w.merge) batch.set(w.ref, w.body, { merge: true }); else batch.set(w.ref, w.body);
          });
          try { await batch.commit(); }
          catch (e) { say(e); throw e; }
        }
      },

      addMember: function (email) {
        return dbMod.updateDoc(dbMod.doc(db, "spaces", activeSpace),
          { memberEmails: dbMod.arrayUnion(String(email).trim().toLowerCase()) });
      },
      removeMember: function (email) {
        return dbMod.updateDoc(dbMod.doc(db, "spaces", activeSpace),
          { memberEmails: dbMod.arrayRemove(String(email).trim().toLowerCase()) });
      },
      joinSpace: async function (sid) {
        sid = String(sid || "").trim().toLowerCase();
        var snap = await dbMod.getDoc(dbMod.doc(db, "spaces", sid));   // נדחה אם המייל לא ברשימה
        if (!snap.exists()) throw new Error("not-found");
        await dbMod.setDoc(dbMod.doc(db, "users", auth.currentUser.uid), { spaceId: sid }, { merge: true });
        watch(sid);
        return sid;
      }
    };

    authMod.onAuthStateChanged(auth, async function (u) {
      unwatch();
      activeSpace = null;
      if (!u) { bridge.onUser(null); return; }
      bridge.onUser({ uid: u.uid, email: (u.email || "").toLowerCase(), name: u.displayName || "" });
      try {
        var sp = await ensureSpace(u);
        bridge.onHome(sp.homeSpaceId);
        watch(sp.spaceId);
      } catch (e) { say(e); }
    });
  } catch (e) {
    bridge.onDown();
  }
}
